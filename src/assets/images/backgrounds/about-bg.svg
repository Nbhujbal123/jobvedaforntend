<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="">
  <defs>
    <linearGradient id="aboutBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffaf8" />
      <stop offset="100%" stop-color="#fff2ec" />
    </linearGradient>
    <radialGradient id="aboutBlob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f05a28" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#f05a28" stop-opacity="0" />
    </radialGradient>
    <filter id="aboutBlur"><feGaussianBlur stdDeviation="50" /></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#aboutBase)" />
  <circle cx="1320" cy="140" r="320" fill="url(#aboutBlob)" filter="url(#aboutBlur)" />
  <circle cx="180" cy="780" r="280" fill="url(#aboutBlob)" filter="url(#aboutBlur)" />

  <!-- abstract skyline / office silhouette, low opacity -->
